<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate blackout test</title>
<style>
:root{--canvas:#f6f5f1;--surface:#fff;--ink:#16150f;--ink-2:#3b3932;--muted:#6b685f;--line:#e2dfd7;--fill:#ecebe5;--fill-2:#e2e0d8;--btn:#16150f;--btn-h:#2e2c26;--btn-fg:#fff;--ring:rgba(22,21,15,.45);--warn-fg:#892300;--neg-fg:#bd002a;--pos-fg:#00550c;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#14130f;--surface:#1e1d18;--ink:#f3f1ea;--ink-2:#d2cfc5;--muted:#9a978c;--line:#34322b;--fill:#2a2923;--fill-2:#34332c;--btn:#f3f1ea;--btn-h:#fff;--btn-fg:#14130f;--ring:rgba(243,241,234,.5);--warn-fg:#ffb38a;--neg-fg:#ff8fa3;--pos-fg:#7be08a}}
:root[data-theme="dark"]{--canvas:#14130f;--surface:#1e1d18;--ink:#f3f1ea;--ink-2:#d2cfc5;--muted:#9a978c;--line:#34322b;--fill:#2a2923;--fill-2:#34332c;--btn:#f3f1ea;--btn-h:#fff;--btn-fg:#14130f;--ring:rgba(243,241,234,.5);--warn-fg:#ffb38a;--neg-fg:#ff8fa3;--pos-fg:#7be08a}
body{margin:0;padding:16px;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
main{max-width:720px;margin:0 auto;display:grid;gap:12px}
h1{font-size:1.25rem;margin:0}
label{display:grid;gap:6px;font-size:.875rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{height:40px;padding:0 16px;border:0;border-radius:9px;background:var(--btn);color:var(--btn-fg);font:500 .875rem var(--sans);cursor:pointer}
pre{background:var(--fill);padding:12px;border-radius:9px;overflow:auto;font-size:.8125rem;margin:0}
img{max-width:100%;border:1px solid var(--line);border-radius:9px;background:#fff}
</style>
</head>
<body>
<main>
  <h1>Certificate blackout: test page</h1>
  <p>Pick a certificate (JPG, PNG, WebP or PDF, up to 10 MB). Nothing is uploaded.</p>
  <label>Certificate file <input id="f" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf"></label>
  <div class="row">
    <label style="display:flex;gap:6px;align-items:center"><input id="cq" type="checkbox" checked> Cover QR codes</label>
    <button id="go" type="button">Open the blackout tool</button>
    <button id="theme" type="button">Switch light / dark</button>
  </div>
  <pre id="out" aria-live="polite">No result yet.</pre>
  <img id="img" alt="Result" hidden>
</main>
<script src="redact.js"></script>
<script>
var out = document.getElementById('out'), img = document.getElementById('img');
window.testResult = null;
window.runRedact = function (file, opts) {
  window.testResult = 'pending';
  return BridgesRedact.open(file, opts).then(function (blob) {
    window.testResult = blob;
    if (!blob) { out.textContent = 'Result: null (cancelled or refused). ' + (BridgesRedact.lastError || ''); img.hidden = true; return null; }
    out.textContent = 'Result: ' + blob.type + ', ' + blob.size + ' bytes';
    img.src = URL.createObjectURL(blob); img.hidden = false;
    return blob;
  });
};
document.getElementById('go').onclick = function () {
  var f = document.getElementById('f').files[0];
  if (!f) { out.textContent = 'Choose a file first.'; return; }
  runRedact(f, { coverQR: document.getElementById('cq').checked });
};
document.getElementById('theme').onclick = function () {
  var r = document.documentElement, d = r.getAttribute('data-theme') === 'dark';
  r.setAttribute('data-theme', d ? 'light' : 'dark');
};
</script>
</body>
</html>
